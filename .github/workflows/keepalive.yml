# Ücretsiz Supabase projesi 7 gün hareketsiz kalırsa durur. Bu iş 3 günde bir ping RPC'sini çağırır.
# URL ve publishable anahtar js/config.js içinden okunur (ikisi de herkese açık); secret gerekmez.
# GitHub, 60 gün commit almayan herkese açık depoda zamanlanmış işleri kapatır.
# Bu yüzden son commit 45 günden eskiyse iş boş bir commit atar.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: ping RPC
        run: |
          set -eu
          url=$(sed -n "s/.*SUPABASE_URL = '\([^']*\)'.*/\1/p" js/config.js)
          key=$(sed -n "s/.*SUPABASE_ANON_KEY = '\([^']*\)'.*/\1/p" js/config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::warning::js/config.js içinde Supabase ayarı yok; ping atlandı."
            exit 0
          fi
          # Eski JWT anahtarı (eyJ...) Bearer olarak da gider; yeni sb_publishable_ anahtarı gitmez.
          auth=()
          case "$key" in eyJ*) auth=(-H "Authorization: Bearer $key") ;; esac
          curl -fsS --retry 3 --max-time 30 -X POST "${url%/}/rest/v1/rpc/ping" \
            -H "apikey: $key" "${auth[@]}" \
            -H "Content-Type: application/json" -d '{}'
          echo

      - name: Depoyu canlı tut (60 gün kuralı)
        run: |
          set -eu
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Son commit $age_days gün önce."
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: depo canlı"
            git push
          fi
